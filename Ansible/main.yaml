- name: Configure K3s Master
  hosts: k3s_master
  become: true
  tasks:
    - name: Install K3s master server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - \
          --flannel-backend=vxlan \
          --disable-network-policy \
          --write-kubeconfig-mode=644
      args:
        creates: /etc/systemd/system/k3s.service # This task will be skipped if K3s is already installed
      register: k3s_install
      changed_when: k3s_install.rc != 0

    - name: Wait for K3s service to be active
      systemd:
        name: k3s
        state: started
        enabled: yes

    - name: Get K3s join token from master
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_output
      changed_when: false

    # Set facts that will be accessible via hostvars
    - name: Set master facts for workers to use
      set_fact:
        k3s_token: "{{ k3s_token_output.stdout }}"
        k3s_master_ip: "{{ ansible_default_ipv4.address }}" # Use reliable Ansible fact

- name: Configure K3s Workers
  hosts: k3s_workers
  become: true
  tasks:
    - name: Install K3s agent on worker nodes
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['k3s_master'][0]]['k3s_master_ip'] }}:6443 K3S_TOKEN={{ hostvars[groups['k3s_master'][0]]['k3s_token'] }} sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service
      register: k3s_agent_install
      changed_when: k3s_agent_install.rc != 0